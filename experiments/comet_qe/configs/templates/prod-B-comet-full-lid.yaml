# ═══════════════════════════════════════════════════════════════
# PROD B: COMET-XLMR — Full Features + LID (Ranking Anchor)
# Rationale: Best Pearson (0.840) & Spearman (0.848) of any model.
# COMET pre-trained weights + LID prepend + 4 entropy types.
# Needs longer training (peak at epoch 14).
# ═══════════════════════════════════════════════════════════════
experiment_name: prod-B-comet-full-lid
model_name: models/comet-xlmr
data_path: data/final_production_split.csv

input_columns:
  - L1_context
  - L1_source_word
  - en_target_clue
  - en_target_pos
  - en_target_word

# ── Architecture ──────────────────────────────────────────────
use_hybrid_model: true
deep_mlp: true
use_lora: false

# ── Loss ──────────────────────────────────────────────────────
loss_function: huber
loss_kwargs:
  delta: 1.0

# ── Feature Flags ─────────────────────────────────────────────
use_attention: true
use_levenshtein: true
use_normalized_levenshtein: true
use_jaccard: true
use_pinyin: true
use_subword_ratio: true
use_cefr: false
use_lid: false
use_dense_embeddings: false
prepend_lid: true

# ── Entropy Flags ─────────────────────────────────────────────
use_target_context_entropy: true
use_target_source_alignment: true
use_target_source_entropy: true
use_context_target_entropy: true
use_multi_layer_entropy: true
use_attention_variance: false
use_global_cls_entropy: false

# ── Layer Config ──────────────────────────────────────────────
multi_layer_funneling: true
funneling_layers: [8, 10, -1]

# ── Training ──────────────────────────────────────────────────
learning_rate: 3e-5
train_batch_size: 32
eval_batch_size: 16
num_train_epochs: 22
weight_decay: 0.01
max_length: 256
seed: 42
fp16: true
logging_steps: 50
save_total_limit: 2
